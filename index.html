<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>綜合工具箱網頁版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1e1e1e; color: #fff; overflow: hidden; }

        /* 上方頁籤列 */
        #tab-bar { height: 35px; background: #181818; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 10px; gap: 4px; user-select: none; }
        .tab-button { padding: 6px 14px; font-size: 12px; background: #252526; color: #999; border: 1px solid #333; border-bottom: none; border-radius: 4px 4px 0 0; cursor: pointer; transition: 0.15s; }
        .tab-button:hover { background: #2d2d2d; color: #ccc; }
        .tab-button.active { background: #2d2d2d; color: #4ec9b0; font-weight: bold; border-color: #0e639c; }

        /* 工具內容顯示區 (iframe 載入區) */
        #content-area { flex: 1; position: relative; width: 100%; height: calc(100vh - 35px); background: #181818; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <!-- 頁籤導覽列 -->
    <div id="tab-bar"></div>

    <!-- 內容容器 -->
    <div id="content-area">
        <iframe id="tool-frame" src=""></iframe>
    </div>

<script>
    // ⚙️ 工具設定清單
    const toolsConfig = [
        { id: 1, name: "工具 1：PSD 排列與匯出", file: "tool1.html" },
        { id: 2, name: "工具 2：資料夾圖檔排列", file: "tool2.html" }
    ];

    const tabBar = document.getElementById('tab-bar');
    const toolFrame = document.getElementById('tool-frame');
    let currentTabId = null;

    // 初始化頁籤
    function initTabs() {
        tabBar.innerHTML = '';
        toolsConfig.forEach((tool, index) => {
            const btn = document.createElement('div');
            btn.className = 'tab-button';
            btn.innerText = tool.name;
            btn.dataset.id = tool.id;
            btn.onclick = () => switchTab(tool.id);
            tabBar.appendChild(btn);
        });

        // 預設載入第一個工具
        if (toolsConfig.length > 0) {
            switchTab(toolsConfig[0].id);
        }
    }

    // 切換工具頁籤
    function switchTab(id) {
        if (currentTabId === id) return;
        currentTabId = id;

        const targetTool = toolsConfig.find(t => t.id === id);
        if (!targetTool) return;

        // 更新 UI 頁籤狀態
        const tabs = tabBar.querySelectorAll('.tab-button');
        tabs.forEach(tab => {
            if (parseInt(tab.dataset.id) === id) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });

        // 強制更新 iframe 頁面
        toolFrame.src = targetTool.file;
    }

    // 確保 DOM 載入後執行
    document.addEventListener('DOMContentLoaded', initTabs);
</script>
</body>
</html>
